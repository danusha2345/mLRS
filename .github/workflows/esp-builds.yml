name: ESP builds

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/esp-builds.yml"
      - "esp/**"
      - "mLRS/**"
      - "platformio.ini"
      - "requirements-tools.txt"
      - "run_setup.py"
      - "tests/**"
      - "tools/run_make_esp_firmwares.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Host tests and 33 ESP targets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-tools.txt

      - name: Install pinned build dependencies
        run: |
          python -m pip install --require-hashes -r requirements-tools.txt
          python -m pip install platformio==6.1.19
          pio --version

      - name: Generate fastMAVLink sources
        run: python run_setup.py --mavlink --silent --no-pause

      - name: Run host regression tests
        run: tests/host/run_host_tests.sh

      - name: Build and verify all ESP firmware targets
        run: |
          python tools/run_make_esp_firmwares.py \
            --version v1.4.03-ci --nopause

          test "$(find tools/esp-build/firmware -maxdepth 1 \
            -type f -name '*.bin' | wc -l)" -eq 33
          test -z "$(find tools/esp-build/firmware -maxdepth 1 \
            -type f -name '*.bin' -size 0 -print -quit)"

  bridge:
    name: Wireless bridge variants
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned PlatformIO Core
        run: |
          python -m pip install platformio==6.1.19
          pio --version

      - name: Build and verify bridge variants
        run: |
          for environment in \
            bridge-esp32c3-at \
            bridge-esp32-pico-at \
            bridge-esp8266-at
          do
            pio run --project-dir esp/mlrs-wireless-bridge \
              --environment "$environment"
            test -s "esp/mlrs-wireless-bridge/.pio/build/$environment/firmware.bin"
          done
