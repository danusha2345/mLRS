name: STM32 toolchains

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stm32-toolchains.yml"
      - "mLRS/**"
      - "run_setup.py"
      - "requirements-tools.txt"
      - "tests/**"
      - "tools/**"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Build all STM32 firmware targets
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: GCC ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 11.3.Rel1
            archive: arm-gnu-toolchain-11.3.rel1-x86_64-arm-none-eabi.tar.xz
            sha256: d420d87f68615d9163b99bbb62fe69e85132dc0a8cd69fca04e813597fe06121
            url: https://developer.arm.com/-/media/Files/downloads/gnu/11.3.rel1/binrel/arm-gnu-toolchain-11.3.rel1-x86_64-arm-none-eabi.tar.xz
          - version: 14.3.Rel1
            archive: arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
            sha256: 8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd
            url: https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-tools.txt

      - name: Install pinned generator dependencies
        run: python -m pip install --require-hashes -r requirements-tools.txt

      - name: Generate libraries and copy STM32 drivers
        run: >-
          python run_setup.py --copy --mavlink --dronecan --silent --no-pause

      - name: Run host regression tests
        run: tests/host/run_host_tests.sh

      - name: Install Arm GNU Toolchain ${{ matrix.version }}
        env:
          ARCHIVE: ${{ matrix.archive }}
          SHA256: ${{ matrix.sha256 }}
          TOOLCHAIN_URL: ${{ matrix.url }}
        run: |
          install -d "$RUNNER_TEMP/arm-gnu"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$ARCHIVE" "$TOOLCHAIN_URL"
          printf '%s  %s\n' "$SHA256" "$RUNNER_TEMP/$ARCHIVE" \
            | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/arm-gnu"
          archive_root="${ARCHIVE%.tar.xz}"
          echo "TOOLCHAIN_DIR=$RUNNER_TEMP/arm-gnu/$archive_root/bin" \
            >> "$GITHUB_ENV"

      - name: Build STM32 matrix
        env:
          FULL_MATRIX: ${{ github.event_name == 'workflow_dispatch' && inputs.full_matrix }}
        run: |
          install -d artifacts
          size_report="artifacts/stm32-sizes-gcc-${{ matrix.version }}.txt"
          : > "$size_report"

          if [ "$FULL_MATRIX" = "true" ]; then
            python tools/run_make_firmwares.py \
              --toolchain-dir "$TOOLCHAIN_DIR" \
              --version 1.4.03-ci --nopause
            "$TOOLCHAIN_DIR/arm-none-eabi-size" tools/build/*/*.elf \
              >> "$size_report"
          else
            for target in \
              rx-matek-mr24-30-g431kb \
              rx-R9M-f103c8 \
              rx-R9MLitePro-v15-f303cc \
              rx-matek-mr900-22-wle5cc \
              tx-matek-mr24-30-g431kb
            do
              python tools/run_make_firmwares.py \
                --toolchain-dir "$TOOLCHAIN_DIR" \
                --target "$target" --version 1.4.03-ci --nopause
              "$TOOLCHAIN_DIR/arm-none-eabi-size" tools/build/*/*.elf \
                >> "$size_report"
            done
          fi

          {
            echo "### STM32 sizes — GCC ${{ matrix.version }}"
            echo '```text'
            cat "$size_report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: stm32-sizes-gcc-${{ matrix.version }}
          path: artifacts/stm32-sizes-gcc-${{ matrix.version }}.txt
          if-no-files-found: error
